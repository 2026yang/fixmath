name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pystray

      - name: Build
        run: python -m PyInstaller packaging/fixmath.spec --noconfirm

      - name: Zip
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_name }}" -like "v*") {
            "${{ github.ref_name }}".TrimStart("v")
          } else {
            "${{ inputs.version }}"
          }
          Compress-Archive -Path dist/FixMath/* -DestinationPath "dist/FixMath-$version.zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FixMath-*.zip
          generate_release_notes: true
